# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Dashboard -> New -> Blueprint -> select this repo.
#
# NOTE: the free plan has 512 MB RAM. Camoufox (Firefox) + generation can be
# tight; if the service restarts/OOMs during generation, switch plan to
# `starter` (or any >=1 GB instance).
services:
  - type: web
    name: perchance-image-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
