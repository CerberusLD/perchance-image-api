# Render Blueprint — Perchance-only (Camoufox) edition.
#
# IMPORTANT: a real browser needs CPU and RAM. The free plan (512 MB / 0.1 CPU)
# cannot run Camoufox reliably; use the Starter plan (2 GB / 0.5 CPU) or higher.
# Verified: Camoufox passes Perchance's Turnstile from datacenter IPs.
services:
  - type: web
    name: perchance-image-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
